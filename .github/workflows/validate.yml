name: Validate skill manager
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: make test
      - run: make package
      - run: make validate-docs OUTPUT=.
      - run: make check-docs-export
      - run: make export-docs
